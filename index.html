<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRONTSEAT STRATEGIES</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- LOGO IMAGES -->
  <img id="logo-fs" src="images/Global/FS.png" alt="FS Logo" />
  <img id="logo-st" src="images/Global/ST.png" alt="ST Logo" />

  <!-- ABOUT LINK -->
  <img id="about-link" src="images/Global/About.png" alt="About" />

  <!-- PROJECT NAVIGATOR -->
  <div id="project-navigator"></div>

  <!-- TOP BAR (overlayed on top of the images) -->
  <header id="top-bar">
    <!-- Left: Studio MHK / Back (icon wrapped in a span) -->
    <div id="studio-toggle">
      <span class="studio-icon">⛐</span> Backseat Studio
    </div>
    <!-- Center: Project numbers (populated dynamically) -->
    <nav id="project-numbers"> </nav>
    <!-- Right: (View All) / (Back) for Overview mode -->
    <div id="view-toggle">(View All)</div>
  </header>

  <!-- VERTICAL CAROUSEL: Main portfolio view -->
  <div id="vertical-carousel">
    <!-- Project cards will be inserted dynamically -->
  </div>

  <!-- DETAIL VIEW: Opens when clicking a project -->
  <div id="detail-view">
    <div id="detail-overlay"></div>
    <button id="close-detail">✕</button>
    <div id="detail-content">
      <div id="detail-carousel">
        <!-- All images will be dynamically inserted here -->
      </div>
    </div>
    <div id="detail-caption"></div>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
